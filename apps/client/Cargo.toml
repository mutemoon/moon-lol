[package]
name = "client"
version = "0.1.0"
edition = "2021"

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.14" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.14", features = ["font-kit", "wayland", "runtime_shaders"] }
gpui-component = "=0.11.0"
gpui-component-assets = { package = "gpui-kit-assets", version = "=0.11.0" }
lol_rl_protocol = { path = "../../crates/lol_rl_protocol" }
lol_web_protocol = { path = "../../crates/lol_web_protocol" }
lol_client = { path = "../../crates/lol_client" }
lol_agent_runtime = { path = "../../crates/lol_agent_runtime" }
lol_game_process_manager = { path = "../../crates/lol_game_process_manager" }
bincode = "1.3"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "process", "net", "signal"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
sqlx = { version = "0.8.3", default-features = false, features = [
    "runtime-tokio-native-tls",
    "sqlite",
] }
uuid = { version = "1", features = ["v4"] }
reqwest = "0.12"
async-trait = "0.1"
tracing = "0.1.40"
anyhow = "1"
rust-i18n = "4.2"
ron = "0.8"
lol_share = { path = "../../crates/lol_share" }
league_property = { path = "../../crates/league_property" }
league_loader = { path = "../../crates/league_loader" }
rayon = "1.10"
ratex-parser = "0.1.14"
ratex-layout = "0.1.14"
ratex-types = "0.1.14"
ratex-svg = { version = "0.1.14", features = ["standalone", "embed-fonts"] }


