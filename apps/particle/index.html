<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bevy WASM Particle Player</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111827;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
            outline: none;
        }
    </style>
    <!-- Trunk 依赖：编译当前 Rust crate 并注入 -->
    <link data-trunk rel="rust" data-bin="particle" data-wasm-opt="0" />
    <!-- 拷贝着色器及 map.ron -->
    <link data-trunk rel="copy-dir" href="../../assets/shaders" data-target-path="assets/shaders" />
    <!-- 拷贝 Riven 粒子贴图资源 -->
    <link data-trunk rel="copy-dir" href="../../assets/ASSETS/Characters/Riven" data-target-path="assets/ASSETS/Characters/Riven" />
</head>
<body>
</body>
</html>
